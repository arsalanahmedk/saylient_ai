openapi: 3.0.3
info:
  title: SaylientAI API
  version: 0.1.0
servers:
  - url: /v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuggestRequest:
      type: object
      required: [text]
      properties:
        text: {type: string, maxLength: 4000}
        tone: {type: string, enum: [polite, friendly, firm, formal]}
        goal: {type: string, maxLength: 300}
    Reply:
      type: object
      properties:
        tone: {type: string}
        text: {type: string}
    SuggestResponse:
      type: object
      properties:
        scenario: {type: string}
        strategy: {type: string, enum: [bald_on_record, positive_politeness, negative_politeness, off_record]}
        replies: {type: array, items: {$ref: '#/components/schemas/Reply'}}
        explanation: {type: string}
        score: {type: integer, minimum: 0, maximum: 100}
        model_version: {type: string}
        suggestion_id: {type: string, format: uuid}
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        '200': {description: OK}
  /suggest:
    post:
      summary: Generate reply suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SuggestRequest'}
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuggestResponse'}
        '400': {description: Validation error}
        '401': {description: Unauthenticated}
        '429': {description: Rate limited}
        '503': {description: Model unavailable}
  /analyze:
    post:
      summary: Detect scenario and face-threat level
      responses:
        '200': {description: Analysis}
  /history:
    get:
      summary: List saved suggestions
      responses:
        '200': {description: List}
    delete:
      summary: Delete all history
      responses:
        '204': {description: Deleted}
  /feedback:
    post:
      summary: Submit feedback
      responses:
        '201': {description: Created}
